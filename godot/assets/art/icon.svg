<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER APP ICON, on the same terms as everything in assets/art/: it is
  geometry, not artwork, and it is meant to be replaced. See docs/ART_GUIDE.md.

  It ships because the alternative is shipping Godot's default robot, which
  tells a player the game was never finished being set up. This at least says
  what the game is: a card, face down, on a dark table, with the parlour's four
  element glyphs at its corners.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="44" fill="#14121a"/>
  <!-- the card -->
  <rect x="78" y="46" width="100" height="164" rx="10"
        fill="#1f1c25" stroke="#d4b038" stroke-width="4"/>
  <!-- the eye on its back -->
  <ellipse cx="128" cy="128" rx="34" ry="21" fill="none" stroke="#d4b038" stroke-width="4"/>
  <circle cx="128" cy="128" r="9" fill="#d4b038"/>
  <!-- the four elements, one at each corner of the card -->
  <g fill="#d4b038" opacity="0.85">
    <path d="M100 76 l9 15 h-18 z"/>
    <path d="M156 76 l9 15 h-18 z" transform="rotate(180 156 83.5)"/>
    <path d="M100 172 l9 9 -9 9 -9 -9 z"/>
    <rect x="147" y="172" width="18" height="18"/>
  </g>
</svg>
