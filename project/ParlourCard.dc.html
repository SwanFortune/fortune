<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;box-sizing:border-box;width:{{ c.w }};height:{{ c.h }};text-align:left;background:{{ c.bg }};border:1px solid {{ c.border }};border-top:2px solid {{ c.accent }};border-radius:5px;padding:8px 9px 9px;display:flex;flex-direction:column;gap:5px;opacity:{{ c.opacity }};">
  <div style="flex:0 0 auto;min-height:52px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:4px;width:100%;">
    <span onMouseEnter="{{ c.costOver }}" onMouseLeave="{{ c.kwOut }}" style="font:400 {{ c.costSize }} 'Instrument Serif',serif;color:{{ c.topColor }};cursor:help;">{{ c.topMark }}</span>
    <span style="min-width:0;min-height:2.3em;display:flex;align-items:center;justify-content:center;text-align:center;font:400 {{ c.nameSize }} 'Instrument Serif',Georgia,serif;color:{{ c.fg }};text-wrap:pretty;overflow:hidden;">{{ c.name }}</span>
    <span onMouseEnter="{{ c.mendOver }}" onMouseLeave="{{ c.kwOut }}" style="font:400 {{ c.mendSize }} 'Instrument Serif',serif;color:{{ c.mendColor }};cursor:help;">{{ c.mend }}</span>
  </div>
  <div style="flex:1 1 0;min-height:0;align-self:center;width:calc(100% - 12px);box-sizing:border-box;border-radius:3px;border:1px dashed {{ c.artEdge }};background:{{ c.artFill }};display:flex;align-items:flex-end;justify-content:center;padding:5px 5px 4px;overflow:hidden;">
    <span style="display:flex;flex-wrap:wrap;justify-content:center;gap:2px 3.5px;text-align:center;font:400 {{ c.artSize }} 'JetBrains Mono',monospace;color:rgba(234,228,215,.72);">
      <sc-for list="{{ c.tokens }}" as="t" hint-placeholder-count="0">
        <span onMouseEnter="{{ t.over }}" onMouseLeave="{{ t.out }}" style="font-weight:{{ t.weight }};color:{{ t.color }};cursor:{{ t.cursor }};">{{ t.t }}</span>
      </sc-for>
    </span>
  </div>
  <div style="flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:5px;min-height:6px;line-height:1;">
    <sc-if value="{{ c.hasArch }}" hint-placeholder-val="{{ false }}">
      <span onMouseEnter="{{ c.archOver }}" onMouseLeave="{{ c.kwOut }}" style="display:flex;align-items:center;gap:4px;cursor:help;">
        {{ c.archIcon }}
        <span style="font:500 6.5px/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:{{ c.archColor }};">{{ c.archWord }}</span>
      </span>
    </sc-if>
    <sc-if value="{{ c.once }}" hint-placeholder-val="{{ false }}">
      <span onMouseEnter="{{ c.onceOver }}" onMouseLeave="{{ c.kwOut }}" style="font:500 6.5px/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:oklch(0.74 0.13 250);cursor:help;">ONCE</span>
    </sc-if>
  </div>
  <sc-if value="{{ c.hasNote }}" hint-placeholder-val="{{ false }}">
    <span style="text-align:center;min-height:10px;font:500 7px/1.3 'JetBrains Mono',monospace;letter-spacing:.14em;color:{{ c.noteColor }};animation:{{ c.noteAnim }};">{{ c.note }}</span>
  </sc-if>
  <sc-if value="{{ c.showFlavor }}" hint-placeholder-val="{{ false }}">
    <span style="position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:9px;width:{{ c.flavorW }};z-index:120;background:oklch(0.185 0.018 60);border:1px solid rgba(234,228,215,.16);border-radius:5px;padding:9px 11px;box-shadow:0 12px 30px rgba(0,0,0,.6);text-align:center;font:400 italic 12px/1.5 'Instrument Serif',Georgia,serif;color:rgba(234,228,215,.62);text-wrap:pretty;">{{ c.flavor }}</span>
  </sc-if>
  <sc-if value="{{ c.kwOpen }}" hint-placeholder-val="{{ false }}">
    <span style="position:absolute;top:-4px;left:104%;width:{{ c.kwW }};z-index:130;background:oklch(0.205 0.02 62);border:1px solid rgba(234,228,215,.22);border-radius:3px;padding:9px 11px;text-align:left;box-shadow:0 14px 34px rgba(0,0,0,.6);">
      <span style="display:block;font:500 {{ c.kwHeadSize }} 'JetBrains Mono',monospace;letter-spacing:.16em;color:oklch(0.84 0.12 85);margin-bottom:6px;">{{ c.kwWord }}</span>
      <span style="display:block;font:400 {{ c.kwBodySize }} 'JetBrains Mono',monospace;color:rgba(234,228,215,.62);text-wrap:pretty;">{{ c.kwDesc }}</span>
    </span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:190},&quot;c&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
